    <script>
      (function() {
        var isMetaMaskError = function(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || err.reason || JSON.stringify(err))) || '';
          return msg.toLowerCase().indexOf('metamask') !== -1 || msg.toLowerCase().indexOf('failed to connect') !== -1 || msg.toLowerCase().indexOf('ethereum') !== -1;
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (isMetaMaskError(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isMetaMaskError(e.error || e.message)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
