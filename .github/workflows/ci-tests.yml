name: CI/CD Test Pipeline & SonarCloud

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-build:
    name: Run All 482+ Tests & Verify Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Test Suite (Vitest)
        run: npm run test:run

      - name: Lint Codebase
        run: npm run lint

      - name: Production Build Verification
        run: npm run build
