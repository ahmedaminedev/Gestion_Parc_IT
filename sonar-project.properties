# =====================================================================
# Configuration SonarQube - OMODA & JAECOO Parc IT & Support
# =====================================================================

# Clé unique identifiant le projet sur le serveur SonarQube
sonar.projectKey=omoda-jaecoo-parc-it
sonar.projectName=OMODA & JAECOO - Parc IT & Support
sonar.projectVersion=1.0.0

# Répertoire racine des sources et encodage
sonar.sources=src,Backend
sonar.sourceEncoding=UTF-8

# Fichiers de tests unitaires et d'intégration
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.ts,src/test/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# Chemin vers le rapport de couverture LCOV généré par Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions pour l'analyse de qualité et de couverture
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.d.ts,\
  **/vite-env.d.ts

# Exclusions de duplication de code (fichiers de test, types purs)
sonar.cpd.exclusions=\
  src/test/**,\
  src/types/**

# Qualité des règles TypeScript / JavaScript
sonar.typescript.tsconfigPath=tsconfig.json
