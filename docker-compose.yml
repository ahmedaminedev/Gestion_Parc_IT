# ====================================================================
# Docker Compose pour Windows Server 2025 (Docker Windows Containers)
# Application : OMODA & JAECOO - Gestion de Parc IT & Support
# ====================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: omoda-jaecoo-parc-it:latest
    container_name: parc-it-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Connexion MongoDB :
      # - Si MongoDB est installé sur votre Windows Server hôte : mongodb://host.docker.internal:27017/Gestion_Parc_IT_2
      # - Si MongoDB est sur le Cloud (Atlas) : mongodb+srv://<user>:<password>@cluster.mongodb.net/Gestion_Parc_IT_2
      - MONGODB_URI=mongodb://host.docker.internal:27017/Gestion_Parc_IT_2
      - JWT_SECRET=Secret_Key_OMODA_JAECOO_WindowsServer_2025
      - ACCESS_TOKEN_EXPIRY=20m
      - REFRESH_TOKEN_SECRET=Secret_Refresh_OMODA_JAECOO_WindowsServer_2025
      - REFRESH_TOKEN_EXPIRY=1d
      - MAX_SESSION_DURATION=5d
      - SESSION_WARNING_BEFORE_EXPIRY=1m
      - REFRESH_BEFORE_EXPIRY=1m
    volumes:
      - app_uploads:C:\app\uploads

volumes:
  app_uploads:
